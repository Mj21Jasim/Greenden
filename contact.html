<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greenden | Contact</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="font-sans">

    <!-- Navbar -->
    <nav class="bg-green-100 p-4 flex items-center justify-between shadow-xl">
        <h1 class="text-2xl font-bold">Greenden</h1>

        <ul class="flex gap-5 md:gap-8 text-gray-600">
            <li>
                <a href="index.html" class="hover:underline hover:text-black">Home</a>
            </li>
            <li>
                <a href="products.html" class="hover:underline hover:text-black">Products</a>
            </li>
            <li>
                <a href="contact.html" class="hover:underline hover:text-black">Contact</a>
            </li>
        </ul>
    </nav>

    <!-- Contact Section -->
    <section class="min-h-screen bg-green-50 p-6 md:p-12 flex justify-center">

        <div class="bg-black text-white w-full max-w-2xl p-6 md:p-10 rounded-lg">

            <h1 class="text-3xl font-bold mb-8 text-center">
                Contact Us
            </h1>

            <form>

                <label class="block mb-2">Name</label>
                <input
                    type="text"
                    placeholder="Enter your name"
                    class="w-full p-3 text-black rounded mb-5"
                >

                <label class="block mb-2">Email</label>
                <input
                    type="email"
                    placeholder="Enter your email"
                    class="w-full p-3 text-black rounded mb-5"
                >

                <label class="block mb-2">Message</label>
                <textarea
                    rows="5"
                    placeholder="Enter your message"
                    class="w-full p-3 text-black rounded mb-6"
                ></textarea>

                <button
                    type="submit"
                    class="bg-green-400 text-black px-6 py-3 rounded font-semibold hover:bg-green-300"
                >
                    Submit
                </button>

            </form>

        </div>

    </section>

    <!-- Contact Information -->
    <section class="text-center p-10">

        <h2 class="text-2xl font-bold mb-4">
            Get In Touch
        </h2>

        <p class="text-gray-600">
            Email: support@greenden.com
        </p>

        <p class="text-gray-600 mt-2">
            Phone: +91 98765 43210
        </p>

    </section>

    <!-- Footer -->
    <footer class="bg-green-100 p-8 text-center">

        <h1 class="text-2xl font-bold">Greenden</h1>

        <p class="mt-3 text-gray-600">
            Bringing nature closer to your home.
        </p>

        <p class="mt-4 text-sm text-gray-500">
            © 2026 Greenden. All Rights Reserved.
        </p>

    </footer>

</body>

</html>
